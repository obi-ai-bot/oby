<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obys</title>
<!-- The Obys of a conversation, together in the margin beside the chat: yours
     and the other people's, standing on this page's bottom edge as a floor.
     Load it in a web view or an iframe sized to the margin (next to
     vendor/three.module.js); it draws on a transparent background and fits
     whatever size it's given. Through window.obys (see The conversation,
     below) the app tells it who's in the conversation, when a reply is being
     written and which Obys are in on it (they huddle up and talk it over
     until it's done), and when it can't be seen (pause). Everything else
     they do on their own.
     ?px= sets the body's width in CSS px (40); the other URL knobs are for
     the test page (group.html). The dev blocks are its hooks, and
     package/build.sh strips them. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  /* its own size in px (set with the renderer's), on the floor at the left:
     the page resized, it's never stretched to the new size before it's redrawn
     (a frame of squashed, widened Obys); new room just shows nothing till then */
  canvas { position: fixed; left: 0; bottom: 0; display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
let N = 0;   // how many are here now (Obys join and leave)
const BODY_PX = Math.max(8, parseFloat(params.get('px')) || 40);   // body width on screen
let W = innerWidth, H = innerHeight;                     // the page is their stage
let STILL = false;  // no life, for comparing the look (test page)
let LAB = false;    // the first swears at the second on a loop (censor-lab.html)
let devTick = null; // the test page's per-frame hook
const num = (k, v) => (params.has(k) ? parseFloat(params.get(k)) : v);
/* dev:start  the test page's knobs (package/build.sh strips every dev block) */
STILL = params.has('still'); LAB = params.has('lab');
/* dev:end */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = THREE.MathUtils.clamp;

/* Springs, as the mascot's (oby.html): every value chases a target. */
const PRESET = {
  body: [120, 16], jelly: [260, 13], face: [300, 30], mouth: [320, 28], gaze: [650, 46], blink: [1600, 75], ear: [200, 11],
  drowse: [10, 6.5],  // eyes drooping shut, head nodding
};
// where it stands and its hops aren't springs: they're thrown and fall (see move)
const DEFAULTS = {
  rx: [0, 'body'], ry: [0, 'body'], rz: [0, 'body'],
  sq: [1, 'jelly'], lean: [0, 'body'],
  gx: [0, 'gaze'], gy: [0, 'gaze'], blink: [0, 'blink'], open: [1, 'face'], wide: [0, 'face'],
  lidT: [0, 'face'], lidA: [0, 'face'], happy: [0, 'face'], mouth: [0, 'mouth'], grin: [0, 'mouth'],
  eLB: [0.1, 'ear'], eRB: [0.1, 'ear'], eLO: [0, 'ear'], eRO: [0, 'ear'], eLT: [0, 'ear'], eRT: [0, 'ear'],
};
function springs() {
  const P = {};
  for (const [k, [v, p]] of Object.entries(DEFAULTS)) { const [s, d] = PRESET[p]; P[k] = { v, vel: 0, to: v, k: s, d }; }
  return P;
}
function stepSprings(P, dt) {
  for (const k in P) { const s = P[k]; s.vel += (s.k * (s.to - s.v) - s.d * s.vel) * dt; s.v += s.vel * dt; }
}

/* The mascot's look (LOOK in oby.html) */
// round: the corners' radius, as a share of the body's width. The full mascot
// is 0.23 on a cube, but drawn in perspective and outlined its silhouette
// measures rounder (about 0.27 of its width across, 0.24 up), and squashed to
// its height a plain 0.23 would round less up than across: so here the
// corners are cut to what the mascot looks like (?round= / ?roundy= to try others)
const LOOK = { round: 0.27, roundY: 0.24, width: 0.93, height: 0.75 };
const EAR = { x: 0.26, z: -0.04, w: 0.095, d: 0.05, h: 0.14, sink: 0.1, tipIn: 0.55, tipR: 0.004 };

/* One shader for body and ears: the mascot's deform (squash from the bottom,
   lean), its soft light, and on the body the eyes (rounded pills) and the
   mouth, in face units (the mascot's 512 face canvas × 0.002). */
const VERT = /* glsl */`
uniform float uSq, uLean, uW, uH;
#ifdef EAR
uniform vec3 uEarBase, uEarTilt; uniform float uEarSide, uEarH;
mat3 earRot(vec3 p) {
  float s = 0.35 + 0.65 * clamp((p.y - uEarBase.y) / uEarH, 0., 1.);
  float b = -uEarTilt.x * s, o = -uEarTilt.y * uEarSide * s, t = uEarTilt.z * uEarSide;
  mat3 rx = mat3(1., 0., 0., 0., cos(b), sin(b), 0., -sin(b), cos(b));
  mat3 rz = mat3(cos(o), sin(o), 0., -sin(o), cos(o), 0., 0., 0., 1.);
  mat3 ry = mat3(cos(t), 0., -sin(t), 0., 1., 0., sin(t), 0., cos(t));  // swivel, whole ear (to a sound)
  return rz * rx * ry;
}
#endif
vec3 deformP(vec3 p) {
  p.x *= uW; p.z *= uH;
  p.y = (p.y + 0.5) * uH - 0.5;
  p.y = (p.y + 0.5) * uSq - 0.5;
  p.xz *= inversesqrt(uSq);
  float h = p.y + 0.5;
  p.x += uLean * h * h;
  return p;
}
vec3 deformN(vec3 p, vec3 n) {
  vec3 r = abs(n.y) < 0.95 ? vec3(0., 1., 0.) : vec3(1., 0., 0.);
  vec3 t1 = normalize(cross(n, r)), t2 = cross(n, t1);
  vec3 d0 = deformP(p);
  return normalize(cross(deformP(p + t1 * 0.003) - d0, deformP(p + t2 * 0.003) - d0));
}
varying vec3 vN, vP;
void main() {
  vec3 p = position, n = normalize(normal);
#ifdef EAR
  mat3 R = earRot(p);
  p = uEarBase + R * (p - uEarBase); n = R * n;
#endif
  vP = p;
  vN = normalize(normalMatrix * deformN(p, n));
  gl_Position = projectionMatrix * modelViewMatrix * vec4(deformP(p), 1.);
}`;
const FRAG = /* glsl */`
uniform vec3 uLight, uFill, uInk; uniform float uShade, uW, uH;
#ifndef EAR
uniform vec4 uEyes;    // gaze x, gaze y (face units), how open (0 shut, 1 open), how wide (surprise)
uniform vec4 uFace;    // lids: how far down, slope to the inner corners (+ cross, - worried); happy (^ ^); mouth open
uniform float uGrin;   // laughing: the mouth wide, flat on top, round below
#endif
varying vec3 vN, vP;
float pill(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
#ifndef EAR
// how much ink the face has at f (face units), its edges px wide
float faceInk(vec2 f, float px) {
  float H0 = 0.224 * (1. + 0.2 * uEyes.w);
  float h = max(H0 * uEyes.z, 0.022);
  float w = 0.128 * (1. + 0.2 * uEyes.w) * (1. + 0.32 * (1. - h / H0));
  float lidT = uFace.x, lidA = uFace.y, happy = uFace.z, m = uFace.w;
  float dr = min(w, h) * 0.17 * clamp((h - 0.06) / 0.08, 0., 1.) * (1. - happy) * (1. - clamp(lidT * 3., 0., 1.));
  float ink = 0.;
  for (int i = 0; i < 2; i++) {
    float inner = i == 0 ? 1. : -1.;  // which way is the middle of the face
    vec2 q = f - vec2((float(i) * 2. - 1.) * 0.192 + uEyes.x, -0.0687 + uEyes.y);
    float d = pill(q, vec2(w, h) * 0.5, min(w, h) * 0.46);
    // lids (as the mascot's): what's above a line lidT down from the top goes,
    // the line sloping down to the inner corner by lidA
    d = max(d, q.y - (h * 0.5 - lidT * h - tan(lidA) * q.x * inner));
    // happy: a disc from below takes the bottom, leaving a ^
    float rr = w * 0.78;
    d = max(d, -(length(q - vec2(0., -(h * 0.5 + rr - happy * h * 0.78))) - rr));
    // the catchlight: a dot cut out of the upper right
    d = max(d, -(length(q - vec2(w * 0.25, h * 0.28)) - dr));
    ink = max(ink, 1. - smoothstep(-px, px, d));
  }
  // the mouth: a dot that opens into an O (yawning, talking, gasping, swearing);
  // laughing, it's wide and its top is cut flat
  float g = uGrin;
  vec2 mr = vec2(0.014 + 0.02 * m + 0.075 * g, 0.01 + 0.042 * m + 0.03 * g);
  vec2 mc = vec2(uEyes.x * 0.35, -0.29 + uEyes.y * 0.35 + 0.025 * g);
  float dm = (length((f - mc) / mr) - 1.) * min(mr.x, mr.y);
  dm = max(dm, mix(-1., f.y - mc.y - mr.y * 0.15, g));
  return max(ink, (1. - smoothstep(-px, px, dm)) * smoothstep(0.03, 0.08, m + g));
}
#endif
void main() {
  float lit = smoothstep(0.15, 0.85, dot(normalize(vN), uLight));
  vec3 col = uFill * (1. - uShade * (1. - lit));
#ifndef EAR
  // no branches around this: fwidth needs its neighbours to run the same code,
  // or the eyes' edge breaks up into dashes where a branch starts
  vec2 f = vec2(vP.x * uW, (vP.y + 0.5) * uH - 0.5);  // the face, before squash
  float px = length(fwidth(f));
  float front = step(0.3, vP.z);
  col = mix(col, uInk, faceInk(f, px) * front);
#endif
  gl_FragColor = vec4(col, 1.);
#ifdef DEBUG_N
  gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, 1.);
#endif
}`;

// rounded cube (as oby.html's), its corners' radius per axis (r: x, y, z) so
// they stay round once squashed to the body's height
function roundedCube(size, r, seg = 24) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const h = new THREE.Vector3(size / 2, size / 2, size / 2).sub(r), p = new THREE.Vector3(), q = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    q.set(clamp(p.x, -h.x, h.x), clamp(p.y, -h.y, h.y), clamp(p.z, -h.z, h.z));
    n.subVectors(p, q).divide(r).normalize();          // where on the corner, as if it were round
    p.copy(q).add(n.clone().multiply(r));              // out to the oval corner
    n.divide(r).normalize();                           // and the oval's normal there
    pos.setXYZ(i, p.x, p.y, p.z); nor.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}
// ears (as oby.html's), 12 round instead of 16
function earGeometry(side) {
  const M = 12, pos = [], idx = [], rings = [];
  const uTip = -EAR.tipIn * EAR.w, R = EAR.tipR;
  for (const t of [-1, 0, 0.15, 0.3, 0.45, 0.6, 0.72, 0.84, 0.93, 1]) {
    const k = Math.max(0, t);
    const uo = EAR.w + (uTip + R - EAR.w) * Math.pow(k, 0.8);
    const ui = -EAR.w + (uTip - R + EAR.w) * k;
    rings.push([(uo + ui) / 2, (uo - ui) / 2, Math.max(R * 0.8, EAR.d * Math.pow(1 - k, 0.7)), 0.5 + (t < 0 ? -EAR.sink : t * EAR.h)]);
  }
  for (const [uc, hw, hd, y] of rings) for (let i = 0; i < M; i++) {
    const a = (i / M) * TAU;
    pos.push(side * (EAR.x + uc + hw * Math.cos(a)), y, EAR.z + hd * Math.sin(a));
  }
  for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < M; i++) {
    const a = r * M + i, b = r * M + (i + 1) % M, c = a + M, d = b + M;
    if (side < 0) idx.push(a, b, d, a, d, c); else idx.push(a, d, b, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* Scene: an orthographic camera in CSS px, y up from the floor (the page's
   bottom edge), refitted when the page is resized. */
// multisampled edges: there's no outline to hide the fill's stair-steps, and at
// this size it measured no dearer than without (?noaa turns it off)
const renderer = new THREE.WebGLRenderer({ antialias: !params.has('noaa'), alpha: true, premultipliedAlpha: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, W, H, 0, -1000, 1000);
// a new size: anyone now past the sides is put back inside them (collide)
addEventListener('resize', () => {
  const was = W;
  W = innerWidth; H = innerHeight;
  if (was < 2 * EDGE + GAP) spread(obys.filter((o) => !o.leaving));   // they were piled up at no size at all
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  camera.right = W; camera.top = H; camera.updateProjectionMatrix();
  // a new size clears the canvas: redrawn at once, not blank till the next frame
  if (gone) { renderer.setRenderTarget(null); renderer.clear(); } else draw();
});

const SHARED = {
  uLight: { value: new THREE.Vector3(-0.3, 0.45, 1).normalize() },
  // colours go out as they are (sRGB), as oby.html's
  uFill: { value: new THREE.Color().setHex(0xf1f1ee, THREE.LinearSRGBColorSpace) },
  uInk: { value: new THREE.Color().setHex(0x0d0d0e, THREE.LinearSRGBColorSpace) },
  uShade: { value: 0.16 },
  uW: { value: LOOK.width }, uH: { value: LOOK.height },
};
/* Swearing is censored the TV way: a flat square over its mouth that shows
   what's behind it in big screen pixels. While anyone swears, the frame is
   also drawn into a texture, and the square draws that in blocks. */
// how it looks (Sangam picked #2 in censor-lab.html; each can be set in the URL there): blocks across
// a body, the square's size and height on the face (in bodies; the face's
// middle is -0.18, the mouth -0.29), how much lighter or darker each block is
// (noise), whether the blocks shimmer, how much darker the whole square is
const CENSOR = { blocks: num('cblocks', 9), w: num('cw', 0.44), h: num('ch', 0.32), y: num('cy', -0.26), noise: num('cnoise', 0.3), shimmer: num('cjit', 1), shade: num('cshade', 0) };
const BLOCK = Math.max(2, BODY_PX / CENSOR.blocks);   // CSS px
const censorRT = new THREE.WebGLRenderTarget(1, 1);
const censorScene = new THREE.Scene();
const censorMat = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: censorRT.texture }, uRes: { value: new THREE.Vector2() }, uBlock: { value: 1 },
    uNoise: { value: CENSOR.noise }, uShimmer: { value: CENSOR.shimmer }, uShade: { value: CENSOR.shade }, uSeed: { value: 0 } },
  vertexShader: 'void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tScene; uniform vec2 uRes; uniform float uBlock, uNoise, uShimmer, uShade, uSeed;
    void main() {
      // the screen in blocks (the grid hops a little as the seed changes, if it shimmers)
      vec2 off = vec2(fract(uSeed * 0.37), fract(uSeed * 0.61)) * uBlock * uShimmer;
      vec2 cell = floor((gl_FragCoord.xy - off) / uBlock);
      vec2 c = (cell + 0.5) * uBlock + off, o = vec2(0.25 * uBlock);
      // each block the average of four points across it, a touch lighter or darker
      vec4 a = (texture2D(tScene, (c - o) / uRes) + texture2D(tScene, (c + o) / uRes)
        + texture2D(tScene, (c + vec2(o.x, -o.y)) / uRes) + texture2D(tScene, (c + vec2(-o.x, o.y)) / uRes)) * 0.25;
      float n = fract(sin(dot(cell + floor(uSeed) * uShimmer, vec2(12.9898, 78.233))) * 43758.5453);
      a.rgb *= max(0., 1. - uShade + uNoise * (n - 0.5) * 2.);   // premultiplied: alpha stays
      gl_FragColor = a;
    }`,
  transparent: true, premultipliedAlpha: true, depthTest: false, depthWrite: false,
});
const censorGeo = new THREE.PlaneGeometry(1, 1);
const censorBuf = new THREE.Vector2();
const faceMid = new THREE.Vector3();
const DEFS = params.has('normals') ? { DEBUG_N: '' } : {};  // ?normals: shows them as colours
// the radius before the body's squashed to its height: across as it is, up and
// back (both squashed by height / width) by that much more
const ry0 = num('roundy', LOOK.roundY) * LOOK.width / LOOK.height;
const bodyGeo = roundedCube(1, new THREE.Vector3(num('round', LOOK.round), ry0, ry0), parseInt(params.get('seg')) || 24);
const earGeo = [earGeometry(-1), earGeometry(1)];
const S = BODY_PX / LOOK.width;  // CSS px per body unit

// how they stand on the floor, and how they move
let clock = 0;
const G = 52 * S;                  // gravity (px/s²): a half-body hop is up and down in about 0.3s
const GAP = BODY_PX * 1.15;        // where they like to stand, centre to centre
const TOUCH = BODY_PX * 0.96;      // touching (the rounded corners meet)
const EDGE = BODY_PX * 0.7;        // closest to the canvas's sides: room to turn without being cut off
const HEAD = 0.4 * S;              // eye height above the floor
// Depth: z is how far back from the front row (px). Further back, an Oby is
// drawn smaller, higher and nearer the middle, as from a camera FAR away and
// LIFT above the floor, but each one is drawn flat on (a real perspective
// camera this close would show the sides of the ones near the edges).
const FAR = BODY_PX * 12, LIFT = BODY_PX * 1.2, ZMAX = BODY_PX * 1.5;
function project(o) {
  o.s = FAR / (FAR + o.z);
  o.sx = W / 2 + (o.x - W / 2) * o.s;
  o.sy = LIFT * (1 - o.s) + o.y * o.s;
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const chance = (p) => Math.random() < p;

let made = 0;
// a new Oby called name, standing at x (CSS px) in the front row
function makeOby(name, x) {
  const i = made++;   // its own phase for the sway and the like
  const U = { ...SHARED, uSq: { value: 1 }, uLean: { value: 0 } };
  const rig = new THREE.Group();
  const eyes = { value: new THREE.Vector4(0, 0, 1, 0) }, face = { value: new THREE.Vector4() }, grin = { value: 0 };
  rig.add(new THREE.Mesh(bodyGeo, new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms: { ...U, uEyes: eyes, uFace: face, uGrin: grin }, defines: DEFS })));
  const ears = [-1, 1].map((side, j) => {
    const u = { uEarBase: { value: new THREE.Vector3(side * EAR.x, 0.5, EAR.z) }, uEarTilt: { value: new THREE.Vector3() }, uEarSide: { value: side }, uEarH: { value: EAR.h } };
    rig.add(new THREE.Mesh(earGeo[j], new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms: { ...U, ...u }, defines: { ...DEFS, EAR: '' } })));
    return u;
  });
  rig.scale.setScalar(S);
  scene.add(rig);
  const censor = new THREE.Mesh(censorGeo, censorMat);
  censor.visible = false;
  censorScene.add(censor);
  return {
    censor,
    i, rig, U, eyes, face, grin, ears, P: springs(), t: rand(0, 10),
    name,
    // on the floor: x along it, z back from the front row; y up off it (CSS px)
    x, z: 0, y: 0, vx: 0, vz: 0, vy: 0,
    sx: 0, sy: 0, s: 1,         // where it's drawn (see project)
    air: false, crouch: false, press: 0,
    look: null, lookUntil: 0,   // { at: an Oby } | { pt: a point (the pointer, the fly, the bee) } | { you: true } | { ry, gy }: a glance away; eyes: only the eyes move (frozen still)
    pose: {},                   // what it's holding on top of where it looks: head (rx, ry, rz), lean, sq, face, ears; still (no sway), censor (swearing)
    cast: null,                 // the scene it's in, if any
    asleep: false, startled: false, busy: 0, pokes: 0, lastPoke: -99,
    shake: -99, jitter: -99,    // a head shake (till), an angry tremble (till)
    blinkEnd: -1, nextBlink: rand(0.5, 3), flyCool: 0,
    queue: [],                  // what it does next, and when: [{ t, fn }]
  };
}
const obys = [];   // on the stage now (see The conversation)
const others = (o) => obys.filter((b) => b !== o);
// free for something new: not in a scene (a reply included), asleep, or startled
const idle = (o) => !o.cast && !o.asleep && !o.startled;
const grounded = (o) => !o.air && !o.crouch;
const later = (o, delay, fn) => o.queue.push({ t: clock + delay, fn });
// left to right, as they stand now (they can pass behind each other)
const line = () => [...obys].sort((a, b) => a.x - b.x);
const beside = (o) => { const l = line(), k = l.indexOf(o); return [l[k - 1], l[k + 1]]; };
// the one beside it, more often than one further off
const neighbour = (o) => {
  const side = beside(o).filter(Boolean);
  return side.length && chance(0.75) ? pick(side) : pick(others(o)) ?? null;   // null: it's on its own
};
const near = (a, b, k = 1.6) => Math.abs(a.x - b.x) < BODY_PX * k;

/* ---------------------------------------------------------------------------
   Small moves
--------------------------------------------------------------------------- */
function pose(o, p) { Object.assign(o.pose, p); }
function unpose(o, ...keys) { if (!keys.length) o.pose = {}; else for (const k of keys) delete o.pose[k]; }
// a spring on another preset for a while (eyes drooping slowly), and back
function preset(o, keys, name) { for (const k of keys) [o.P[k].k, o.P[k].d] = PRESET[name ?? DEFAULTS[k][1]]; }
function blink(o) { if (!o.asleep) { o.P.blink.to = 1; o.blinkEnd = clock + 0.075; } }

// Where it looks. A big turn of the head comes with a blink, as animals do
// (not when startled: then its eyes stay wide).
function lookAt(o, look, dur) {
  if ('at' in look && !look.at) return;   // nobody to look at (it's on its own)
  if (!o.startled) {
    const ry = aimAt(o, look).ry;
    if (Math.abs(ry - o.P.ry.v) > 0.3 && chance(0.6)) blink(o);
  }
  o.look = look; o.lookUntil = clock + dur;
  if (look.at) emit(o, 'look', look.at);
  else if (look.you) emit(o, 'you');
}
// The head and eyes for what it's looking at, worked out every frame, so it
// keeps following one that moves (up into a hop and back down, a fly, the pointer).
function aimAt(o, L) {
  const a = { ry: 0, rx: 0, gx: 0, gy: 0 };
  // an Oby by where it stands; a point (pointer, fly) by where it is on screen
  const t = L?.at ? { x: L.at.x, y: L.at.y + HEAD, z: L.at.z } : L?.pt ? { x: L.pt.x, y: L.pt.y, z: o.z } : null;
  if (t) {
    const dx = L.at ? t.x - o.x : t.x - o.sx, dy = L.at ? t.y - (o.y + HEAD) : t.y - (o.sy + HEAD * o.s);
    // one further back takes more of a turn, but never its back to you: past
    // about 50° the eyes do the rest (actors on a stage do the same)
    const back = Math.max(0, (t.z - o.z) / BODY_PX);
    a.ry = clamp(dx / (S * 2.2) * (1 + back * 0.8), -0.85, 0.85);
    a.gx = clamp(dx / S * 0.04, -0.07, 0.07);
    a.gy = clamp(dy / S * 0.05, -0.05, 0.08);
    // the eyes do most of looking up: turned and tipped back a lot, the head reads as tilted
    a.rx = -clamp(dy / S * 0.07, -0.2, 0.12);
    // frozen still: only the eyes follow it
    if (L.eyes) { a.ry *= 0.12; a.rx *= 0.15; a.gx = clamp(dx / S * 0.06, -0.09, 0.09); a.gy = clamp(dy / S * 0.06, -0.05, 0.08); }
  } else if (L?.you) a.gy = 0.01;
  else if (L) { a.ry = L.ry; a.gx = L.ry * 0.08; a.gy = L.gy; }
  else if (o.rest?.toward) { const b = aimAt(o, { at: o.rest.toward }); a.ry = b.ry * 0.4; a.gx = b.gx * 0.5; }
  else if (o.rest) { a.ry = o.rest.ry; a.gx = o.rest.gx; a.gy = o.rest.gy; }
  return a;
}
// Where it looks when it isn't looking at anything: its own, and changing
// every few seconds (off to the side, down at the floor, half turned to the
// one beside it, far off), only now and then straight out at you
function restLook(o) {
  const r = Math.random(), side = chance(0.5) ? -1 : 1, nb = N > 1 ? neighbour(o) : null;
  o.rest = r < 0.3 ? { ry: side * rand(0.12, 0.35), gx: side * rand(0, 0.03), gy: rand(-0.02, 0.02) }
    : r < 0.5 ? { ry: rand(-0.15, 0.15), gx: 0, gy: -rand(0.02, 0.045) }
    : r < 0.7 && nb ? { toward: nb }
    : r < 0.87 ? { ry: side * rand(0.3, 0.5), gx: side * 0.03, gy: rand(0.01, 0.04) }
    : { ry: rand(-0.06, 0.06), gx: 0, gy: 0 };
  o.nextRest = clock + rand(3, 8);
}

// A hop: it crouches, springs up, and lands where it aimed (in place, or a step)
function hop(o, h, toX = o.x, now = false, toZ = o.z) {
  if (o.air || o.crouch) return;
  const go = () => {
    o.crouch = false; o.on = null; o.climb = null;
    o.vy = Math.sqrt(2 * G * h * S); o.air = true;
    const T = 2 * o.vy / G;
    const lo = o.offstage ? -BODY_PX * 2 : EDGE, hi = o.offstage ? W + BODY_PX * 2 : W - EDGE;  // running off the edge
    o.vx = (clamp(toX, lo, hi) - o.x) / T;
    o.vz = (clamp(toZ, 0, ZMAX) - o.z) / T;
    o.P.sq.vel += 4;  // stretches up off the floor
    emit(o, 'hop');
  };
  if (now) return go();
  o.crouch = true; o.crouchAt = clock;
  later(o, 0.13, go);
}
// A step: a small hop sideways, keeping its distance from the one beside it
function step(o) {
  const [l, r] = beside(o);
  const lo = l ? l.x + GAP : EDGE, hi = r ? r.x - GAP : W - EDGE;
  // one that's wandered off from the others steps back toward them
  const nearest = others(o).sort((a, b) => Math.abs(a.x - o.x) - Math.abs(b.x - o.x))[0];
  const way = nearest && Math.abs(nearest.x - o.x) > GAP * 1.8 ? Math.sign(nearest.x - o.x) : chance(0.5) ? -1 : 1;
  const to = clamp(o.x + way * rand(0.4, 0.9) * BODY_PX, lo, hi);
  if (Math.abs(to - o.x) < 4 && o.z < 2) return lookAt(o, { at: neighbour(o) }, rand(1, 2));
  lookAt(o, { ry: Math.sign(to - o.x) * 0.45, gy: 0 }, 0.6);  // looks where it's going
  o.stepping = true;
  later(o, 0.2, () => hop(o, 0.2, to, false, 0));  // a step brings it back to the front row
}
// Pleased: a squint and a little bob
function smile(o) {
  pose(o, { happy: 0.8 }); o.P.sq.vel -= 1.5;
  later(o, 0.5, () => unpose(o, 'happy'));
}
// Laughing: eyes squeezed to ^ ^, head thrown back (or doubled over), and the
// whole body bouncing with each "ha", mouth opening, rocking side to side, the
// bounces dying away; now and then it starts with a little hop
function laugh(o, n = 4) {
  n += 1;
  pose(o, { happy: 1, grin: 1, rx: chance(0.7) ? -0.16 : 0.2, earO: 0.2 });
  o.jitter = clock + n * 0.15 + 0.2;   // and a fast little shake all through it
  for (let k = 0; k < n; k++) later(o, k * 0.15, () => {
    const f = 1 - k / (n + 1);
    o.P.sq.vel -= 6 * f; o.P.rz.vel += (k % 2 ? 1 : -1) * 2.2 * f;
    o.P.eLB.vel += 4 * f; o.P.eRB.vel += 4 * f;
    o.pose.mouth = 0.8; later(o, 0.08, () => { if (o.pose.grin) o.pose.mouth = 0.15; });   // ha
    if (k === 0 && grounded(o) && chance(0.4)) hop(o, 0.12, o.x, true);
  });
  later(o, n * 0.15 + 0.35, () => unpose(o, 'happy', 'grin', 'rx', 'mouth', 'earO'));
}
// knowing: slow deep nods with its eyes half shut (mm-hm)
function knowing(o) {
  pose(o, { lidT: 0.35, gy: -0.01 });
  for (let k = 0; k < 3; k++) later(o, 0.1 + k * 0.42, () => { o.P.rx.vel += 3.2; });
  later(o, 1.4, () => unpose(o, 'lidT', 'gy'));
}
// A yawn, and it's catching: the one beside it often yawns a moment later
// (one that caught it doesn't pass it on)
function yawn(o, catching = true) {
  if (catching) for (const b of beside(o)) if (b && idle(b) && chance(0.4)) later(b, rand(1, 2.2), () => idle(b) && yawn(b, false));
  pose(o, { mouth: 1, open: 0.3, sq: 1.1, rx: -0.14, earO: 0.25 });
  later(o, 1.2, () => { unpose(o, 'mouth', 'open', 'sq', 'rx', 'earO'); blink(o); later(o, 0.25, () => blink(o)); });
}
const shakeHead = (o, dur = 1) => { o.shake = clock + dur; o.shakeDur = dur; };
// A head tilt (hm?), which the one watching it now and then copies a beat later
function tilt(o, side = pick([-1, 1]), copied = false) {
  pose(o, { rz: side * rand(0.08, 0.14) });
  if (!copied) lookAt(o, chance(0.5) ? { you: true } : { ry: side * 0.2, gy: 0.02 }, 1.4);
  later(o, 1.4, () => unpose(o, 'rz'));
  if (!copied) for (const b of beside(o)) if (b && idle(b) && chance(0.35)) later(b, rand(0.5, 0.9), () => { if (!idle(b)) return; lookAt(b, { at: o }, 1.4); tilt(b, side, true); });
}
// Hiccups: little jumps it can't help, every second or so; the ones beside it stare
function hiccups(o) {
  const n = 4 + Math.floor(Math.random() * 3);
  o.busy = o.hiccupUntil = clock + n * 1.5 + 1;
  for (let k = 0; k < n; k++) later(o, k * rand(1.2, 1.7), () => {
    if (!idle(o)) return;
    pose(o, { wide: 1, mouth: 0.35 }); o.P.sq.vel += 5;
    if (grounded(o)) hop(o, 0.1, o.x, true);
    later(o, 0.18, () => unpose(o, 'wide', 'mouth'));
    if (k === 1) for (const b of beside(o)) if (b && idle(b)) lookAt(b, { at: o }, 3);
    if (k === n - 1) later(o, 0.8, () => { if (idle(o)) { blink(o); later(o, 0.2, () => blink(o)); } });
  });
}
// Solo moves, for whoever's free: most are small
const SOLO = [
  [22, (o) => N > 1 && lookAt(o, { at: neighbour(o) }, rand(1.2, 2.5))],
  [4, (o) => lookAt(o, { you: true }, rand(1, 2))],
  [9, (o) => lookAt(o, { ry: rand(-0.45, 0.45), gy: rand(0.02, 0.06) }, rand(0.8, 1.6))],   // a glance away, or up
  [5, (o) => lookAt(o, { ry: rand(-0.2, 0.2), gy: -0.045 }, rand(1, 2))],                   // at the floor
  [9, (o) => tilt(o)],                                                                      // head tilt: hm?
  [1, (o) => hiccups(o)],
  [6, (o) => hop(o, rand(0.35, 0.6))],
  [9, (o) => step(o)],
  [5, (o) => { for (let k = 0; k < 4; k++) later(o, k * 0.09, () => { o.P.rz.vel += (k % 2 ? 1 : -1) * 3; }); }],    // a wiggle
  [6, (o) => { o.P[chance(0.5) ? 'eLB' : 'eRB'].vel += 9; }],                                // an ear flick
  [4, (o) => yawn(o)],
  [3, (o) => { pose(o, { ry: TAU }); hop(o, 0.5); later(o, 1.1, () => { o.P.ry.v -= TAU; unpose(o, 'ry'); }); }],  // a spin
  [5, (o) => { pose(o, { sq: 0.92 }); later(o, rand(2, 4), () => unpose(o, 'sq')); }],       // settles down low for a bit
  [3, (o) => { blink(o); later(o, 0.22, () => blink(o)); }],
];
const SOLO_TOTAL = SOLO.reduce((s, [w]) => s + w, 0);
function solo(o) {
  let r = Math.random() * SOLO_TOTAL;
  for (const [w, fn] of SOLO) if ((r -= w) < 0) return fn(o);
}

/* ---------------------------------------------------------------------------
   Awareness: what one does goes out to the rest (emit), and each decides for
   itself whether to react, a beat later, as you would.
--------------------------------------------------------------------------- */
function emit(src, type, target) {
  if (src.startled) return;  // a startled jump is everyone's, not one to watch
  for (const o of others(src)) react(o, src, type, target);
  // now and then one answers a hop with its own (an answer isn't answered)
  if (type === 'land' && !src.stepping && !src.answering && !src.cast && chance(0.25)) {
    const free = others(src).filter((o) => idle(o) && grounded(o));
    if (free.length) { const o = pick(free); later(o, rand(0.35, 0.7), () => { o.answering = true; hop(o, rand(0.3, 0.5)); }); }
  }
}
function react(o, src, type, target) {
  if (!idle(o)) return;
  switch (type) {
    case 'hop':     // watches it go up and come down (and turns an ear to it first)
      if (near(o, src, 2.4)) o.heard = { side: Math.sign(src.x - o.x) || 1, until: clock + rand(0.6, 1.2) };
      if (chance(near(o, src) ? 0.85 : 0.55)) later(o, rand(0.1, 0.35), () => idle(o) && lookAt(o, { at: src }, rand(1.1, 1.8)));
      break;
    case 'land':    // landed right beside it: leans out of the way and looks
      if (near(o, src, 2.4) && !o.look) o.heard = { side: Math.sign(src.x - o.x) || 1, until: clock + rand(0.6, 1.2) };
      if (src.stepping && Math.abs(src.x - o.x) < GAP * 1.12) {
        later(o, rand(0.03, 0.1), () => {
          if (!idle(o)) return;
          o.P.lean.vel += Math.sign(o.x - src.x) * 3;
          lookAt(o, { at: src }, rand(0.9, 1.5));
          if (chance(0.3)) later(o, rand(0.6, 1), () => idle(o) && step(o));
        });
      }
      break;
    case 'look':    // looked at: often looks back, and if they meet, one is pleased
      if (target === o && chance(0.6)) {
        later(o, rand(0.3, 0.8), () => {
          if (!idle(o)) return;
          lookAt(o, { at: src }, rand(1, 1.8));
          if (src.look?.at === o) later(o, rand(0.3, 0.6), () => smile(chance(0.5) ? o : src));
        });
      }
      break;
    case 'you':     // one looks out at you: the ones beside it wonder what at
      if (chance(near(o, src) ? 0.2 : 0.08)) later(o, rand(0.4, 1), () => idle(o) && lookAt(o, { you: true }, rand(1, 2)));
      break;
  }
}
// Knocked into: it staggers the way it was pushed, wide-eyed, and looks round
function bumped(o, by, hard) {
  const d = Math.sign(o.x - by.x);
  o.P.rz.vel += d * 4 * hard; o.P.lean.vel -= d * 2 * hard;
  if (o.asleep) return spook(o, by);
  if (o.cast) return;
  pose(o, { wide: 1 });
  later(o, rand(0.1, 0.25), () => { if (idle(o)) lookAt(o, { at: by }, rand(1, 1.6)); });
  later(o, 0.45, () => unpose(o, 'wide'));
}
// Brushed against: it sways out of the way and glances round
function nudged(o, by) {
  o.P.lean.vel += Math.sign(o.x - by.x) * 1.5;
  if (!o.look) lookAt(o, { at: by }, rand(0.6, 1.1));
}
// Woken with a fright: wide eyes, ears back, a jump away from what did it
function spook(o, by) {
  wake(o);
  o.pose = { wide: 1, earB: 0.9, mouth: 0.6 };
  hop(o, 0.75, o.x + Math.sign(o.x - by.x || 1) * BODY_PX * 0.5, true);
  o.look = { at: by }; o.lookUntil = clock + 2;
  later(o, 0.7, () => unpose(o, 'mouth'));
}

/* ---------------------------------------------------------------------------
   Scenes: a few of them doing something together, scripted with waits. A
   scene can be cut short (you poke one in it, or you arrive): its waits then
   throw, and its cast go back to what they were doing.
--------------------------------------------------------------------------- */
const CANCEL = Symbol('cancel');
const log = [];  // what played, for checking the pacing (test page)
const scenes = new Set(), waits = [];
// a wait in a scene: till cond holds, or max seconds. Cut short (the scene was
// cancelled) it throws, and it checks again on waking: cancelled in the very
// frame it was due, the scene still mustn't take one more step
function until(sc, cond, max = 3) {
  return new Promise((res, rej) => (sc.dead ? rej(CANCEL) : waits.push({ t: clock + max, cond, res, rej, sc })))
    .then(() => { if (sc.dead) throw CANCEL; });
}
const wait = (sc, s) => until(sc, null, s);
function release(o) {
  if (o.on) fallOff(o, Math.sign(o.dx) || 1, false);
  o.dodged = false; o.ghost = false; o.squeeze = false; o.pressZ = 0; o.calm = true; o.jitter = 0; o.climb = null;
  if (o.offstage) { o.offstage = false; o.x = clamp(o.x, EDGE, W - EDGE); }
  o.cast = null; o.pose = {}; o.look = null; o.press = 0; o.working = false;
  if (o.asleep) o.wakeAt = clock + rand(4, 9); else preset(o, ['open', 'rx']);
}
// Left asleep with no scene to wake it (one ended, or it nodded off in one):
// in a while it wakes and yawns (at the back, direct() brings it forward). By
// the clock in tick, not a plan: plans get cleared (a poke, you arriving), and
// an asleep Oby isn't idle, so nothing else would ever pick it up.
function wakeUp(o) { wake(o); yawn(o); }
function join(sc, o) { o.cast = sc; clearPlans(o); sc.cast.push(o); }
// its own plans dropped (and anything it was holding, and a spin unwound to the nearest way round)
function clearPlans(o) {
  o.queue.length = 0; o.gen = (o.gen ?? 0) + 1; o.pose = {}; o.crouch = false;
  o.P.ry.v = Math.atan2(Math.sin(o.P.ry.v), Math.cos(o.P.ry.v));
}
// woken by something (a poke, you, a scene button)
function wake(o) { o.asleep = false; o.wakeAt = 0; preset(o, ['open', 'rx']); }
function start(name, cast, script) {
  const sc = { name, cast: [], dead: false };
  for (const o of cast) join(sc, o);
  scenes.add(sc);
  lastStart[name] = clock;
  log.push(`${clock.toFixed(0)}s ${name}`); if (log.length > 200) log.splice(0, log.length - 200);
  aside(script(sc, ...cast))
    .finally(() => {
      sc.dead = true;   // its side moves (aside) stop with it
      scenes.delete(sc);
      for (const o of sc.cast) if (o.cast === sc) release(o);
      if (SCENES[name] && !BACKGROUND.has(name)) nextScene = clock + rand(10, 24);
      else if (name === 'discussion') nextScene = Math.max(nextScene, clock + rand(8, 16));
    });
  return sc;
}
// a scene cut short anywhere it wasn't being waited on: that's expected, not an error
addEventListener('unhandledrejection', (e) => { if (e.reason === CANCEL) e.preventDefault(); });
// for a scene's moves that run alongside (not waited on): cut short with the scene, quietly
const aside = (p) => p.catch((e) => { if (e !== CANCEL) console.error(e); });
// coming, going, and a reply being talked over: these only end by themselves
const UNSTOPPABLE = new Set(['joins', 'leaves', 'discussion']);
function cancel(sc) {
  if (UNSTOPPABLE.has(sc.name)) return;
  sc.dead = true;
  for (const o of sc.cast) if (o.cast === sc) release(o);
}
// tiptoes or hops over until it's `dist` from t; false if it couldn't get there
async function approach(sc, o, t, dist, h = 0.16) {
  for (let k = 0; k < 8; k++) {
    if (o.cast !== sc) return false;   // taken out of the scene meanwhile
    if (!grounded(o)) await until(sc, () => grounded(o), 2);
    // turned, they're wider: close enough is touching, however they're turned
    const gap = Math.abs(t.x - o.x) - Math.max(dist, extent(o)[0] + extent(t)[0] + 3);
    if (gap < 4 && Math.abs(t.z - o.z) < 6) return true;
    const x0 = o.x, z0 = o.z;
    hop(o, h, o.x + Math.sign(t.x - o.x) * clamp(gap, 0, BODY_PX * 0.7), false, t.z);   // and level with it
    await until(sc, () => o.air, 0.5);
    await until(sc, () => grounded(o), 1.5);
    if (Math.hypot(o.x - x0, o.z - z0) < 3) break;   // got nowhere: it doesn't keep trying
    await wait(sc, rand(0.04, 0.12));
  }
  // close enough: touching it (pressed against it is touching, however they're turned)
  return Math.abs(t.x - o.x) - Math.max(dist, extent(o)[0] + extent(t)[0] + 3) < 10 && Math.abs(t.z - o.z) < 8;
}
async function talk(sc, o, dur, stop = () => false) {
  const end = clock + dur;
  while (clock < end && !stop()) {
    o.pose.mouth = rand(0.35, 0.9); o.P.sq.vel += rand(-0.6, 0.6);
    await wait(sc, rand(0.07, 0.14));
    o.pose.mouth = rand(0, 0.12);
    await wait(sc, rand(0.06, 0.2) + (chance(0.12) ? 0.35 : 0));  // now and then a breath
  }
  o.pose.mouth = 0;
}

// Is someone standing where it would land?
// (as wide and deep as they are now, turned or not)
const blockedAt = (o, x, z) => !o.ghost && obys.some((b) => {
  if (b === o || b.air || b.on) return false;
  const [ox, oz] = extent(o), [bx, bz] = extent(b);
  return Math.abs(b.x - x) < ox + bx - 2 && Math.abs(b.z - z) < oz + bz - 2;
});
// Gets to a spot on the floor in hops; false if it couldn't (or it was taken
// out of the scene meanwhile)
async function goTo(sc, o, x, z, h = 0.14) {
  x = o.offstage ? clamp(x, -BODY_PX * 2, W + BODY_PX * 2) : clamp(x, EDGE, W - EDGE); z = clamp(z, 0, ZMAX);
  let waited = 0;
  for (let k = 0; k < 14; k++) {
    if (o.cast !== sc) return false;
    if (!grounded(o)) await until(sc, () => grounded(o), 2);
    const dx = x - o.x, dz = z - o.z, d = Math.hypot(dx, dz);
    if (d < 4) return true;
    const f = Math.min(1, BODY_PX * 0.7 / d);
    // someone's there: it waits a moment for them to move, rather than hop into them
    if (blockedAt(o, o.x + dx * f, o.z + dz * f)) { if (++waited > 6) return false; await wait(sc, 0.25); continue; }
    const x0 = o.x, z0 = o.z;
    hop(o, h, o.x + dx * f, false, o.z + dz * f);
    await until(sc, () => o.air, 0.5);
    await until(sc, () => grounded(o), 1.5);
    if (Math.hypot(o.x - x0, o.z - z0) < 3) return false;   // that hop got it nowhere: it doesn't keep trying
    await wait(sc, rand(0.03, 0.1));
  }
  return Math.hypot(x - o.x, z - o.z) < 8;
}

// A discussion: while a reply is being written, the Obys in on it huddle up
// and talk it over, for as long as it takes, however many they are. They
// stand in a shallow curve open to you, the middle ones further back (so the
// ones in front partly hide them: that, and being a touch smaller, is what
// shows they're further away). They take turns: the one answering most, the
// rest chipping in; each turn one talks to another, leaning in, and the rest
// look at whoever's talking, nodding, now and then reacting. A long one has
// lulls (they all look away, thinking). Someone brought in mid-way hops over
// and the huddle makes room; one let go steps back out. One on its own gets on
// with it (eyes down, nodding). When it's done they react, maybe all look at
// you, and break up. The rest carry on idling, glancing over now and then.
const BOWL = BODY_PX * 1.35;   // how far back the middle of a huddle stands
// where each stands, left to right, by how many (bodies from the middle)
const SPOTS = { 2: [-0.54, 0.54], 3: [-0.85, 0, 0.85], 4: [-1.4, -0.5, 0.5, 1.4], 5: [-1.75, -0.88, 0, 0.88, 1.75] };
const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(([, v]) => v);
const LONGEST = 600;   // s: a reply nobody ended (the app lost track of it) ends here anyway
// out of the scene it's in, back to itself, and nobody else in that scene minds
function drop(o) {
  const sc = o.cast;
  if (!sc) return;
  sc.cast.splice(sc.cast.indexOf(o), 1);
  release(o);
}
// Where everyone stands for a huddle: the huddle in a curve where most of the
// ones in it are, the others in the front row either side of it, in the order
// they stand, closer together if need be; and if there's no room even then,
// the ones furthest from it wait in the back row, off to its side. A huddle
// wider than the stage is squeezed to fit.
function huddlePlaces(group) {

    }

    if (o.blinkEnd > 0 && clock > o.blinkEnd) { P.blink.to = 0; o.blinkEnd = -1; }
    // a crouch whose jump never came (its plans were cleared meanwhile): it stands back up
    if (o.crouch && clock - (o.crouchAt ?? 0) > 0.5) o.crouch = false;
    if (o.look && clock > o.lookUntil) o.look = null;
    if (!o.look && clock > (o.nextRest ?? 0)) restLook(o);
    // asleep outside any scene: it always wakes in a while (see wakeUp)
    if (o.asleep && !o.cast) { if (!o.wakeAt) o.wakeAt = clock + rand(4, 9); else if (clock >= o.wakeAt) wakeUp(o); }
    if (o.working && clock >= o.nextNod) { o.P.rx.vel += 1.2; o.nextNod = clock + rand(0.5, 1.4); }
    move(o, dt);
  }
  // away, and the last of them under the floor: nothing more to draw
  if (hiding && !gone && obys.every((o) => o.under === 'held')) gone = true;   // (stops after this frame's drawn)
  // resting, and all asleep with nothing buzzing about: drawn at the low rate (frame)
  sleepy = resting && N > 0 && !fly.on && !bee.on && obys.every((o) => o.asleep && !o.air && !o.crouch);
  collide();
  const carried = new Set(obys.map((r) => r.on).filter(Boolean));
  for (const o of obys) {
    const P = o.P, p = o.pose;
    const a = STILL ? { ry: parseFloat(params.get('ry')) || 0, rx: 0, gx: 0, gy: 0 } : aimAt(o, o.look);
    // asleep: head down, breathing slow and deep, nodding a little
    const sleep = o.asleep ? 1 : 0;
    P.ry.to = a.ry + (p.ry ?? 0);
    P.rx.to = a.rx + (p.rx ?? 0) + sleep * (0.15 + 0.03 * Math.sin(o.t * 0.8));
    // never quite still: a slow sway and a weight shift, each its own
    const still = p.still ? 1 : 0;   // frozen in fear: not a sway, hardly a breath
    const drift = sleep || still ? 0 : 0.012 * Math.sin(o.t * 0.5 + o.i * 1.7);
    P.rz.to = (p.rz ?? 0) + drift;
    P.gx.to = a.gx + (p.gx ?? 0); P.gy.to = a.gy + (p.gy ?? 0) - sleep * 0.02;
    P.open.to = sleep ? 0 : p.open ?? 1; P.wide.to = p.wide ?? 0;
    P.lidT.to = p.lidT ?? 0; P.lidA.to = p.lidA ?? 0; P.happy.to = p.happy ?? 0; P.mouth.to = p.mouth ?? 0; P.grin.to = p.grin ?? 0;
    const breath = sleep ? 0.035 * Math.sin(o.t * 1.7) : (still ? 0.003 : 0.012) * Math.sin(o.t * 1.6);
    // squash: crouched to jump, stretched while rising, else what it holds, breathing
    P.sq.to = o.crouch ? 0.84 : o.air && o.vy > 0 ? 1.07 : (p.sq ?? 1) + breath;
    P.lean.to = clamp((p.lean ?? 0) - P.ry.v * 0.05 - o.vx / S * 0.015 + (1 - still) * 0.025 * Math.sin(o.t * 0.7 + o.i * 2.3), -0.2, 0.2);  // trails behind a step
    const out = clamp(o.vy / S * 0.02, -0.15, 0.3), sway = clamp(o.vx / S * 0.03, -0.25, 0.25);
    // one standing on its head: its ears lie flat, back along the top of its
    // head, out of sight
    const carrying = carried.has(o);
    P.eLB.to = P.eRB.to = carrying ? 1.55 : 0.1 + (p.earB ?? 0) + sleep * 0.15;
    // an ear turned to a sound on its side, for a moment
    const heard = clock < (o.heard?.until ?? 0) ? o.heard.side : 0;
    P.eLT.to = heard < 0 ? 0.7 : 0; P.eRT.to = heard > 0 ? 0.7 : 0;
    P.eLO.to = carrying ? 0 : out - sway + (p.earO ?? 0) + sleep * 0.3; P.eRO.to = carrying ? 0 : out + sway + (p.earO ?? 0) + sleep * 0.3;
    const n = Math.ceil(dt / (1 / 240));
    for (let k = 0; k < n; k++) stepSprings(P, dt / n);

    // a head shake and an angry tremble go straight on, too quick for the springs
    let shake = 0, tremble = 0;
    if (clock < o.shake) { const k = (o.shake - clock) / o.shakeDur; shake = Math.sin(o.t * 28) * 0.4 * Math.pow(k, 1.3); }
    if (clock < o.jitter) tremble = Math.sin(o.t * 47) * 0.02;
    o.U.uSq.value = Math.max(0.3, P.sq.v); o.U.uLean.value = P.lean.v;
    project(o);
    o.rig.scale.setScalar(S * o.s);
    o.rig.position.set(o.sx, o.sy + 0.5 * S * o.s, -o.z);
    o.rig.rotation.set(P.rx.v, P.ry.v + P.gx.v * 0.9 + shake, P.rz.v + tremble, 'YXZ');
    o.eyes.value.set(P.gx.v, P.gy.v, (1 - clamp(P.blink.v, 0, 1)) * clamp(P.open.v, 0, 1), P.wide.v);
    o.face.value.set(Math.max(0, P.lidT.v), P.lidA.v, clamp(P.happy.v, 0, 1), Math.max(0, P.mouth.v));
    o.grin.value = clamp(P.grin.v, 0, 1);
    o.ears[0].uEarTilt.value.set(Math.max(-0.15, P.eLB.v), P.eLO.v, P.eLT.v);
    o.ears[1].uEarTilt.value.set(Math.max(-0.15, P.eRB.v), P.eRO.v, P.eRT.v);
    // the censor square: over its mouth (CENSOR), wherever its face is turned
    o.censor.visible = !!p.censor;
    if (p.censor) {
      o.rig.updateMatrixWorld();
      faceMid.set(0, (0.5 + CENSOR.y) * P.sq.v - 0.5, 0.5 * LOOK.height).applyMatrix4(o.rig.matrixWorld);
      o.censor.position.set(faceMid.x, faceMid.y, 500);
      o.censor.scale.set(CENSOR.w * S * o.s, CENSOR.h * S * o.s, 1);
    }
  }
  devTick?.();
}

function draw() {
  renderer.render(scene, camera);
  // while anyone swears: the frame again into a texture, and the censor squares from it
  if (obys.some((o) => o.censor.visible)) {
    const buf = renderer.getDrawingBufferSize(censorBuf);
    if (censorRT.width !== buf.x || censorRT.height !== buf.y) censorRT.setSize(buf.x, buf.y);
    censorMat.uniforms.uRes.value.copy(buf); censorMat.uniforms.uBlock.value = BLOCK * renderer.getPixelRatio();
    censorMat.uniforms.uSeed.value = Math.floor(clock * 10);
    renderer.setRenderTarget(censorRT); renderer.clear(); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.autoClear = false; renderer.render(censorScene, camera); renderer.autoClear = true;
  }
}
let frameStep = (dt) => { tick(dt); draw(); };

// 30fps (10 with them all asleep: rest), and nothing at all while paused,
// hidden, or away under the floor
const FRAME_MS = 1000 / 30;
const SLEEP_MS = 1000 / 10;   // all asleep (rest)
let last = performance.now(), raf = 0, running = false, paused = false, seen = true, awayAt = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  // all asleep: slow breaths need few frames (SLEEP_MS), and the longer step
  // between them is fine (the springs sub-step themselves, in tick)
  if (now - last < (sleepy ? SLEEP_MS : FRAME_MS) - 2) return;
  const dt = Math.min(sleepy ? 1 / 8 : 1 / 20, (now - last) / 1000); last = now;
  frameStep(dt);
  if (gone && running) playIfSeen();   // away, and they're all under: stop
}
// drawing only while it can be seen and someone's on the stage
function playIfSeen() {
  const now = performance.now(), nowSeen = !paused && !document.hidden;
  const back = nowSeen && !seen && now - awayAt > 5000;
  if (seen && !nowSeen) awayAt = now;
  seen = nowSeen;
  const on = nowSeen && N > 0 && !gone;
  if (on !== running) {
    running = on;
    if (on) { last = now; raf = requestAnimationFrame(frame); }
    // left as it is (empty, if the last one's gone); away, just empty: put
    // under at once, they haven't been moved there yet, and would be drawn
    // where they were made
    else { cancelAnimationFrame(raf); if (gone) { renderer.setRenderTarget(null); renderer.clear(); } else draw(); }
  }
  // back after a while out of sight (a page over them gone, the window shown again): they notice you
  if (back && N && !LAB && !hiding && !popping && !resting) arrive();   // (under the floor, or coming back up: away()'s own)
}
function pause(on = true) { paused = !!on; playIfSeen(); }

// Nobody about (see The conversation): one by one, NAP_GAP seconds apart, each
// nods off where it stands and sleeps till rest(false); then they wake, a beat
// apart, with a yawn. One busy (in the air, on someone, in a scene) waits.
let resting = false, restN = 0, sleepy = false;
let NAP_GAP = [10, 20];   // s between one nodding off and the next: the last of 5 about a minute after the first
function rest(on = true) {
  on = !!on;
  if (on === resting) return;
  resting = on;
  restN++;
  // (under the floor or on the way back up: away()'s callback naps them once they've landed)
  if (on) { if (!hiding && !popping) napAll(); return; }
  // a moment to come round first; and no fly or bee the moment they're up (that
  // clock ran on while they slept)
  nextScene = Math.max(nextScene, clock + rand(3, 6));
  nextBackground = Math.max(nextBackground, clock + rand(15, 25));
}
function napAll() {
  const n = restN;
  let t = rand(0.5, 2);
  for (const o of [...obys].sort(() => Math.random() - 0.5)) { after(t, () => nodOff(o, n)); t += rand(...NAP_GAP); }
}
function nodOff(o, n) {
  if (n !== restN || !resting || hiding || !obys.includes(o) || o.leaving) return;
  if (o.cast?.name === 'nap') return;
  if (o.cast || o.air || o.on || o.crouch || o.startled || o.under) { after(1.5, () => nodOff(o, n)); return; }
  start('nap', [o], async (sc) => {
    if (!o.asleep) {
      o.look = null;
      pose(o, { mouth: 1, open: 0.35, sq: 1.08, rx: -0.12, earO: 0.2 }); await wait(sc, 1.3);   // a yawn
      o.pose = { earO: 0.3 }; pose(o, { open: 0.45, sq: 0.97 }); await wait(sc, 1.8);           // eyes droop
      if (!resting) return;   // someone's back before it dropped off: it just perks up
      pose(o, { open: 0, rx: 0 }); o.asleep = true;
    }
    await until(sc, () => !resting || !o.asleep, 1e9);
    // knocked awake (a bump from a scene still going): it nods off again in a while
    if (resting) { after(rand(...NAP_GAP), () => nodOff(o, n)); return; }
    await wait(sc, rand(0, 0.8));
    wakeUp(o);
    await wait(sc, 1.4);   // the yawn plays out
  });
}

// Out of the way and back (see The conversation)
const DEPTH = BODY_PX * 2.4;   // under the floor far enough that the back row's ears don't show
let hiding = false, gone = false, hidAt = 0;
let popping = false;   // hopping back up: nothing starts till they've all landed
let awayN = 0;   // which going-away or coming-back this is (a later one outdates the earlier one's callbacks)
function away(on = true, { now = false } = {}) {
  on = !!on;
  if (on === hiding) return;
  hiding = on;
  const n = ++awayN;
  restN++;   // nodding off waits for them to be back up
  if (on) {
    // not being drawn (paused, hidden): nothing would move, so they'd be found
    // still standing when it's back, and only then sink. Straight under
    now ||= !running;
    hidAt = performance.now();
    for (const sc of scenes) sc.dead = true;   // its waits stop it next frame
    fly.on = bee.on = false;
    for (const o of obys.filter((x) => x.leaving)) remove(o);   // one on its way off is just gone
    // left to right, a beat apart: a little hop, and down through the floor
    [...obys].sort((a, b) => a.x - b.x).forEach((o, i) => {
      free(o); o.look = null;
      o.on = null; o.air = o.crouch = false; o.climb = null; o.vx = o.vz = 0;
      if (now) { o.under = 'held'; o.y = -DEPTH; o.vy = 0; o.underAt = Infinity; return; }
      o.under = 'sink'; o.underAt = clock + i * 0.04;
      o.vy = Math.sqrt(2 * G * BODY_PX * 0.12);
    });
    // nothing's drawn once they're all under (see tick): not on a timer, which
    // runs on while slow frames hold them back, and would stop them mid-way
    if (now) {
      gone = true; playIfSeen();
      // not running, nothing would clear what was last drawn (them standing)
      if (!running) { renderer.setRenderTarget(null); renderer.clear(); }
    }
    return;
  }
  gone = false; popping = true;
  // under the floor, they line up again (someone may have come or gone), then
  // hop up one at a time in no particular order. Called back while some are
  // still on their way down (the panel closed again at once): nobody's moved
  // sideways, and each comes back up from wherever it's got to
  const midway = obys.some((o) => o.under === 'sink');
  if (!midway) spread(obys);
  const order = [...obys].sort(() => Math.random() - 0.5);
  let t = 0.05;
  for (const o of order) {
    if (o.under !== 'sink') o.y = -DEPTH;
    o.under = 'held'; o.vy = 0; o.underAt = clock + t;
    t += rand(0.07, 0.14);
  }
  const long = performance.now() - hidAt > 5000;
  soon.push({ t: clock + t + 0.8, fn: () => {
    if (n !== awayN) return;   // gone again since (and maybe back): that one's callback does this
    popping = false;
    nextScene = clock + rand(5, 8);
    for (const d of live) talkAbout(d);   // a reply still being written: back to it
    if (resting) napAll();                // still nobody about: back to sleep, in a while
    else if (long && !LAB) arrive();      // out of sight a while: they notice you
  } });
  playIfSeen();
}
document.addEventListener('visibilitychange', playIfSeen);
playIfSeen();

window.obys = {
  set, join: joinIn, leave: leaveIt, discuss, pause, away, rest,
  get names() { return obys.filter((o) => !o.leaving).map((o) => o.name); },   // on the stage now
};
// The same from a page it's framed in on another origin (only that page):
// postMessage({ set: names, now }), { join: name }, { leave: name },
// { discuss: names, id } (id required; the same id again when who's in on it
// changes), { end: id }, { pause: true | false }, { away: true | false, now },
// { rest: true | false }
const talking = new Map();
addEventListener('message', (e) => {
  const d = e.data;
  if (e.source !== window.parent || window.parent === window || !d || typeof d !== 'object') return;
  try {
    if ('set' in d) set(d.set, d);
    if ('join' in d) joinIn(d.join);
    if ('leave' in d) leaveIt(d.leave);
    if ('discuss' in d) {
      if (d.id == null) throw new Error('obys: { discuss } needs an id');
      const t = talking.get(d.id);
      if (t?.going) t.set(d.discuss); else talking.set(d.id, discuss(d.discuss));   // one that ended by itself starts again
    }
    if ('end' in d) { talking.get(d.end)?.end(); talking.delete(d.end); }
    if ('pause' in d) pause(d.pause);
    if ('away' in d) away(d.away, d);
    if ('rest' in d) rest(d.rest);
  } catch (err) { console.warn(err.message); }
});

/* dev:start  the test page's hooks (group.html, censor-lab.html, handoff/obys-tests) */
// ?n= puts that many there from ?names= (or a few made-up ones) to begin with
const NAMES = (params.get('names') || 'Yours,Wellington,Ernesto,Dima,Daniel,Ana,Kofi').split(',');
if (params.has('n')) set(NAMES.slice(0, Math.min(MAX, Math.max(1, parseInt(params.get('n')) || 5))), { now: true });
if (LAB) obys.forEach((o, i) => { o.x = W / 2 + (i - 0.5) * 1.3 * BODY_PX; });
// what it costs: JS per frame, and GPU time where the browser allows it
const gl = renderer.getContext();
const timer = gl.getExtension('EXT_disjoint_timer_query_webgl2');
let query = null;
const stats = { fps: 0, js: 0, gpu: null };
let acc = { n: 0, js: 0, gpu: 0, gn: 0, t0: performance.now() };
frameStep = (dt) => {
  const t0 = performance.now();
  tick(dt);
  if (timer && query && gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) {
    if (!gl.getParameter(timer.GPU_DISJOINT_EXT)) { acc.gpu += gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6; acc.gn++; }
    gl.deleteQuery(query); query = null;
  }
  const timing = timer && !query;
  if (timing) { query = gl.createQuery(); gl.beginQuery(timer.TIME_ELAPSED_EXT, query); }
  draw();
  if (timing) gl.endQuery(timer.TIME_ELAPSED_EXT);

  const now = performance.now();
  if (now - acc.t0 >= 1000) {
    stats.fps = acc.n * 1000 / (now - acc.t0); stats.js = acc.js / Math.max(1, acc.n); stats.gpu = acc.gn ? acc.gpu / acc.gn : null;
    acc = { n: 0, js: 0, gpu: 0, gn: 0, t0: now };
  }
};
// a scene asked for by hand starts as soon as they're all free for it
let asked = null, note = null;
devTick = () => {
  if (LAB) { if (!scenes.size) labSwear(); }
  if (!asked) return;
  if (begin(asked.k)) asked = null;
  else if (clock > asked.until) { note = { text: `${asked.k}: not enough of them for it`, until: clock + 3 }; asked = null; }
};
// whatever's going on stops (sleepers wake, replies carry on), and nothing else starts over it for a bit
function makeFree() {
  for (const sc of [...scenes]) cancel(sc);
  for (const o of obys) {
    if (o.cast && UNSTOPPABLE.has(o.cast.name)) continue;
    o.busy = 0; o.startled = false; clearPlans(o);
    if (o.asleep) wake(o);
    if (o.on) fallOff(o, Math.sign(o.dx) || 1, false);
  }
  nextScene = clock + 12; nextBackground = Math.max(nextBackground, clock + 15);
}
// a swears at b, and b's taken aback
const swearAt = (a, b, dur) => start('swear', [a, b], async (sc) => { lookAt(b, { at: a }, 60); await swear(sc, a, b, dur); pose(b, { wide: 1 }); await wait(sc, 0.8); });
const labSwear = () => swearAt(obys[0], obys[1], 3);
window.__obys = obys; window.__log = log; window.__stats = stats;
window.obysDev = {
  scenes: Object.keys(SCENES),
  play(k) { makeFree(); asked = { k, until: clock + 2 }; },
  arrive,
  laugh() { let o = pick(obys.filter(ready)); if (!o) { makeFree(); o = pick(obys); } if (o) { o.busy = clock + 2; laugh(o); } },
  swear() {
    if (N < 2) return;
    const l = line();
    let k = l.findIndex((o, j) => ready(o) && l[j + 1] && ready(l[j + 1]));
    if (k < 0) { makeFree(); k = Math.floor(Math.random() * (N - 1)); }
    const [a, b] = chance(0.5) ? [l[k], l[k + 1]] : [l[k + 1], l[k]];
    swearAt(a, b, 2.4);
  },
  // what's going on, for the test page's line
  status: () => (note && clock < note.until ? note.text : [...scenes].map((s) => s.name).join(' + ') || '·'),
  get clock() { return clock; },
  napGap(a, b) { NAP_GAP = [a, b]; },   // shorter, to see them nod off without the wait
};
/* dev:end */
</script>
