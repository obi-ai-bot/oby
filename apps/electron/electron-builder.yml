# The Mac app, built into dist/ by scripts/package.sh (which notarizes it and makes the DMG).
# The bundle ID stays what every install has: Squirrel.Mac installs only an update meeting the
# running app's designated requirement, and the login item, notifications and oby:// hang on it.
# The name is here, never in package.json: there it would become app.name, which names the app's
# folder (oby-app) and safeStorage's Keychain item ("oby-app Safe Storage", which seals the device
# and owner keys), both package.json's `name` today (name.test.ts).
appId: com.deskree.oby.electron
productName: Oby
directories:
  buildResources: build
  output: dist
# Vite bundles the renderer's packages, and main uses only Electron and Node.
files:
  - out/**
  - native/window-style/build/Release/window_style.node
  - package.json
  - "!node_modules/**"
asarUnpack:
  - native/**/*.node
npmRebuild: false
# No running the app as plain Node, no Node flags or inspector from outside, and only the app's own
# checked asar: main holds obid's token.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# Open in Oby on an Obysphere's join page (oby://join/<host>#…, main/sphere.ts)
protocols:
  - name: Oby
    schemes: [oby]
mac:
  target: dir
  # Never another name: Squirrel.Mac renames an installed app after the update's executable
  # (SQRLInstaller.m, renamedTargetIfNeededWithTargetURL). /Applications/Oby Electron.app would move
  # to Oby.app with the engine still on the old path and no relaunch (its ShipIt was there too), so
  # updated installs keep that folder and new ones are Oby.app; neither ever moves (UPDATES-10).
  extendInfo:
    CFBundleExecutable: Oby Electron
  # Oby's Icon Composer icon (apps/icon): actool makes Assets.car and icon.icns from
  # it, and macOS draws the shape, its margin and shadow
  icon: ../icon/AppIcon.icon
  category: public.app-category.developer-tools
  minimumSystemVersion: "26.0"
  # the identity is scripts/package.sh's CSC_NAME (OBY_SIGN_IDENTITY, Deskree's Developer ID when
  # that's unset): electron-builder doesn't expand ${env.…} here, and would leave the app unsigned
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # obid, gh and gitleaks, staged and signed by scripts/helpers.sh (gitleaks with its own
  # entitlement): obid finds the others and its plug-ins from its own
  # path (core/crates/obid/src/app.rs). Their signatures stay as staged.
  extraFiles:
    - from: build/helpers/Contents/Helpers
      to: Helpers
    - from: build/helpers/Contents/MacOS
      to: MacOS
    - from: build/com.deskree.oby.electron.obid.plist
      to: Library/LaunchAgents/com.deskree.oby.electron.obid.plist
  extraResources:
    - from: build/helpers/Contents/Resources/obid
      to: obid
    - from: build/helpers/Contents/Resources/Licenses
      to: Licenses
    # electron-updater reads it before any download (main/updates.ts): package.sh checks it's there
    - from: build/app-update.yml
      to: app-update.yml
  # ponytail: Chromium's .pak files are resources Electron Framework's own signature seals; signed
  # one by one they'd each wait on Apple's timestamp server (over 200 of them)
  signIgnore:
    - /Contents/Helpers/obid$
    - /Contents/MacOS/(gh|gitleaks)$
    - \.pak$
