# cargo-nextest's settings for this workspace (docs/ci.md, "What GitHub runs").
# The default profile is nextest's own defaults; CI runs with `--profile ci`.

# GitHub's ci.yml: each shard of the suite runs every test to the end, retries a failed test once
# (a pass on the retry shows as `flakyFailure` in the JUnit report, and Check lists it as flaky),
# and stops a test that runs past 5 minutes, so a hung test fails instead of holding its shard.
[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# The flaky list (docs/contracts/ci.md, CI-26 to 28): every [[profile.ci.overrides]] here is one of
# its entries, and the Mac check (scripts/oby-check.sh) reads the same entries. Each is exactly four
# lines: `# <task key>: <what the test waits on>`, the header, a filter naming one binary and one
# test by its full name, never a prefix, and `retries = 2`. GitHub retries a listed test twice, and
# the Mac runs it once more only when it failed and is listed at the merge base too. The list only
# shrinks: a new entry comes with its task, factory/queue/tasks/<key>.md, in the same change, and
# the fix takes its entry out.

# R01-17: Codex's process must end within 1.5 seconds of wall clock (codex.rs:1751)
[[profile.ci.overrides]]
filter = 'binary_id(obid) & test(=codex::tests::a_command_ends_the_codex_process_at_once)'
retries = 2

# R01-18: real checks of `sleep 15`, `sleep 3` and `sleep 60` set its order (runner_api.rs:627)
[[profile.ci.overrides]]
filter = 'binary_id(obid::runner_api) & test(=admission_5_a_job_back_from_the_check_queue_never_passes_max_running)'
retries = 2
