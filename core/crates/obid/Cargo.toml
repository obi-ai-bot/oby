[package]
name = "obid"
description = "Obi's engine as a daemon: the runner API (docs/runner-api.md) and everything behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obi-protocol = { path = "../obi-protocol" }
axum.workspace = true
# The FCM service account's RS256 JWT (crate::push): the RSA that rustls already builds.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64.workspace = true
# The iPhone's sealed pushes (crate::push): HPKE (RFC 9180) base mode, DHKEM(X25519, HKDF-SHA256),
# HKDF-SHA256, ChaCha20-Poly1305, so Deskree's relay only ever carries a sealed blob.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
futures-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
nix.workspace = true
p256.workspace = true
rustix.workspace = true
reqwest.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
getrandom.workspace = true
gethostname.workspace = true
hex.workspace = true
jiff.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# The browser's pinned downloads (src/browser/install): SHA-256 over a stream, already in the tree
# through obi-protocol.
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# NFKD and general categories for memory's rules (src/memory.rs, `widens`): already in the
# tree, through `url`, their compiled data only.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Other computers' direct addresses (src/remote/): the gateway over HTTPS with this computer's
# own certificate, and the window's client that trusts only a pinned one. Already in the tree,
# through reqwest, with the same aws-lc-rs.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The gateway calls obid's own router in process (src/gateway.rs).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
uuid.workspace = true
zip.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Safe access to owned processes' resident memory without ps's setuid/task-port privileges.
libproc = "0.14.11"

[dev-dependencies]
# The channel's tests relay it through a WebSocket server of their own.
axum = { workspace = true, features = ["ws"] }
# Tests that need time to pass move tokio's paused clock instead of sleeping (B00-01).
tokio = { workspace = true, features = ["test-util"] }
