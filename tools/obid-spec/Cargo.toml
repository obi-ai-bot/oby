[workspace]

[package]
name = "obid-spec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "obid's endpoints and background triggers proven black-box, as BLOK workflows and Rust nodes, against the real obid binary"

[[bin]]
name = "obid-spec"
path = "src/main.rs"

[[bin]]
name = "obid-spec-nodes"
path = "src/bin/obid-spec-nodes.rs"

[dependencies]
blok-rs = { git = "https://github.com/well-prado/blok", rev = "3ab281d3", default-features = false, features = ["grpc"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
anyhow = "1"
async-trait = "0.1"
tonic = "0.12"
# gRPC over the nodes child's stdin and stdout, as oby-check-blok's (BLOK-3): no port, no socket.
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = { version = "0.1", default-features = false }
tower = { version = "0.4", features = ["util"] }
# The owner's side, written apart from obid's own crates so the suite checks obid from outside:
# the owner key (Ed25519) signs cards and delegations as the Electron app's shared/sphere.ts does,
# and the device key (P-256) signs the owner's words as its main/words.ts does.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# The lab's pinned-certificate check (src/lab/remote.rs): TLS to another computer's direct address, its certificate pinned by SHA-256.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The stand-in OpenAI's id tokens (src/coverage_accounts_openai.rs): RS256 over a key openssl makes at
# its start. Already built for rustls's own use.
ring = "0.17"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# The browser's secret scan (src/browser.rs, `browser-scan`): every file under a scratch obid's
# home, its browser engine's hundreds of MB included, searched for each secret in well under a second.
memchr = "2"
# Oby Artifacts in the lab (src/lab/artifacts.rs): Claude Design's project zip, out and in.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Oby Artifacts' views in the lab (src/lab/artifactview.rs): chrome-headless-shell over the DevTools
# protocol, and its pictures compared pixel by pixel.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
png = "0.17"
# Oby Artifacts over the Obysphere in the lab (src/lab/artifactsphere.rs): shares, edits back and
# public links in one format, age (the owner's decision of 2026-11-20), a version packed as a tar.
age = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"

# The secret scan's search runs optimised even in a debug build: a naive search over a scratch
# obid's browser engine took minutes, past its step's limit when the browser workflows run at once.
[profile.dev.package.memchr]
opt-level = 3
