[workspace]

[package]
name = "oby-check-blok"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
blok-rs = { git = "https://github.com/well-prado/blok", rev = "3ab281d3", default-features = false, features = ["grpc"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
async-trait = "0.1"
tonic = "0.12"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
