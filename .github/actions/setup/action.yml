# What a Linux runner needs before it scans a change or runs obid's tests (docs/ci.md).
name: setup
description: gitleaks at its pinned version and, when asked, bubblewrap for obid's job sandbox
inputs:
  sandbox:
    description: "true: also install bubblewrap and prove it works here"
    default: "false"
runs:
  using: composite
  steps:
    # The secret scan's own tool, and obid's: its tests run gitleaks from PATH.
    - name: gitleaks
      shell: bash
      env:
        VERSION: 8.30.1
        SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        archive="gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$archive"
        echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/gitleaks"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

    # obid's job sandbox on Linux is bubblewrap (with slirp4netns for an agent's network). Ubuntu
    # 24.04's AppArmor refuses the unprivileged user namespaces it needs, so this throwaway runner
    # allows them. The last line proves bubblewrap works here: a sandbox test that fails after it
    # is the sandbox's failure, not the runner's.
    - name: bubblewrap
      if: inputs.sandbox == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bubblewrap slirp4netns
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        bwrap --ro-bind / / --unshare-all --die-with-parent true
