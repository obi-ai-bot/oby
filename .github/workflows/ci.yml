# CI: the software factory's gate, on GitHub's hosted runners (docs/ci.md, "What GitHub runs";
# docs/contracts/ci.md, CI-70 to 76).
#
#   changes     what the change reaches, from the paths it changed, and gitleaks over the commits
#               it brings
#   rust        core/: fmt, clippy, obid's limits, and every test compiled once; or, for a change
#               that only reaches what the guards read, the guards alone
#   rust-test   those tests, in 4 shards
#   electron    apps/electron: typecheck, tests and build
#   Check       the one required check: every job above passed or was skipped
#
# The same jobs run on every push to a pull request, a draft included, in the merge queue, and on
# dev after each merge (the only run that saves the Rust cache: a pull request can read dev's,
# never another pull request's). No label and no schedule changes what runs.
#
# A job is skipped with `if:`, never with a workflow-level `paths:`: a skipped job reports success,
# while a workflow skipped by a path filter leaves Check pending, which blocks the merge.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [dev]

# A newer push to the same pull request, or to dev, cancels the run it supersedes; a merge queue
# run always runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust's 1.97 channel, so a new stable's lints don't fail a change that didn't touch them. Bump
  # it on purpose. core/Cargo.toml's rust-version is the floor.
  RUSTUP_TOOLCHAIN: "1.97"
  # gitleaks' pin: .github/actions/setup installs exactly this.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.lanes.outputs.rust }}
      electron: ${{ steps.lanes.outputs.electron }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # rust: `full` (lint, limits and every test), `guards` (the guards alone) or `none`.
      # A pull request's diff is from its merge base, the queue's and dev's from the commit before.
      # A path no row names, or a diff that can't be read, reaches everything.
      - name: What the change reaches
        id: lanes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$BASE...$HEAD"; else range="$BASE..$HEAD"; fi
          rust=none electron=false
          guards() { [ "$rust" = full ] || rust=guards; }
          if ! files=$(git diff --name-only "$range"); then
            echo "The diff $range can't be read: everything runs."
            rust=full electron=true files=""
          fi
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              .github/*|scripts/oby-check*|core/Cargo.toml|core/Cargo.lock|rust-toolchain*) rust=full electron=true ;;
              # The app's relay test reads the CDP methods obid's browser sends.
              core/crates/obid/src/browser/*) rust=full electron=true ;;
              core/*|e2e/*|docs/api/*|Makefile) rust=full ;;
              apps/electron/*) electron=true; guards ;;
              apps/shared/*|docs/runner-api.md|docs/contracts/*) guards ;;
              docs/*|factory/*|tools/*|cloud/*|.claude/*|design/*|character/*|apps/ios/*|apps/watch/*|apps/Oby.xcodeproj/*|mcp/*|*.md) ;;
              *) rust=full electron=true ;;
            esac
          done <<< "$files"
          echo "rust=$rust electron=$electron"
          { echo "rust=$rust"; echo "electron=$electron"; } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      # The commits this run brings, with .gitleaks.toml and .gitleaksignore, as the Mac's check
      # scans a change's. Older history isn't rescanned: it was scanned on its own pull requests.
      # With no earlier commit to start from, the head commit alone.
      - name: gitleaks over the new commits
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$(git merge-base "$BASE" "$HEAD")..$HEAD"
          else
            echo "No earlier commit to start from (${BASE:-none}): scanning $HEAD alone."
            range="-1 $HEAD"
          fi
          echo "Scanning $range"
          gitleaks git . "--log-opts=$range" --config .gitleaks.toml --no-banner --redact

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The guards: tests that each keep two places in agreement (obid's routes with
      # docs/api/routes.txt and the apps' calls, who writes a job's state, what released obids
      # wrote, GET /v1/status's capabilities and their doc, the prompt budget, the one unsafe
      # function, no Keychain in the vault, what only the Mac tests, the MCP tool list and protocol
      # versions, and obid's secret scan against this repository's docs and names). A change on
      # either side can break one, so an app-only change runs them too.
      GUARDS: >-
        binary_id(obid::routes_guard) | binary_id(obid::state_owner) | binary_id(obid::released_files)
        | (binary_id(obid::runner_api) & test(/^caps_/))
        | (binary_id(obid) & test(/::(prompt_budget_holds|unsafe_1_only_may_write_is_unsafe|keychain_1_the_vault_never_touches_the_keychain|merging_2_what_only_the_mac_tests_is_the_scripts|agentmcp_7_every_entry_names_every_gate|one_protocol_version_list|clean_docs_and_the_fixture_result_stay_clean|this_repositorys_names_are_clean_and_a_token_among_them_is_found)$/))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          shared-key: rust-${{ needs.changes.outputs.rust }}
          save-if: ${{ github.event_name == 'push' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150

      - name: cargo fmt --check
        if: needs.changes.outputs.rust == 'full'
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: cargo clippy -D warnings
        if: needs.changes.outputs.rust == 'full'
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets --locked -- -D warnings

      # The script's own counting and judging, on the checked commit (in the queue, the group's
      # combined code), measured from the run's base so a limit the commit lowered holds.
      - name: obid's limits
        if: needs.changes.outputs.rust == 'full'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: OBY_CHECK_ONLY=limits scripts/oby-check.sh "$BASE"

      # Compiled once: rust-test's shards run from this archive and compile nothing.
      - name: Build every test
        if: needs.changes.outputs.rust == 'full'
        run: cargo nextest archive --manifest-path core/Cargo.toml --workspace --locked --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.rust == 'full'
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error

      - uses: ./.github/actions/setup
        if: needs.changes.outputs.rust == 'guards'
        with:
          sandbox: "true"

      - name: bubblewrap works
        if: needs.changes.outputs.rust == 'guards'
        run: |
          bwrap --ro-bind / / --unshare-all --die-with-parent true

      # Retries come from core/.config/nextest.toml's ci profile, never from the command line.
      - name: The guards
        if: needs.changes.outputs.rust == 'guards'
        run: |
          cargo nextest run --manifest-path core/Cargo.toml -p obid --lib \
            --test routes_guard --test state_owner --test released_files --test runner_api \
            --locked --profile ci --no-fail-fast --no-tests=fail -E "$GUARDS"

  rust-test:
    name: rust-test (${{ matrix.shard }}/4)
    needs: [changes, rust]
    if: needs.changes.outputs.rust == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150

      - uses: ./.github/actions/setup
        with:
          sandbox: "true"

      - name: bubblewrap works
        run: |
          bwrap --ro-bind / / --unshare-all --die-with-parent true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      # The archive extracts into core/, so its binaries sit at the core/target paths rust compiled
      # them for (env!("CARGO_BIN_EXE_obid") is fixed at compile time), and the workspace's files
      # (the tests' fixtures, routes_guard's docs/api) are this checkout's.
      - name: cargo nextest run (${{ matrix.shard }}/4)
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/core" --extract-to "$GITHUB_WORKSPACE/core" \
            --partition "slice:${{ matrix.shard }}/4" --profile ci --no-fail-fast

  electron:
    name: electron
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      # zsh: the ChatGPT gate's test runs scripts/package.sh with /bin/zsh, which Ubuntu's runner
      # lacks. Nothing compiles here: postinstall only downloads Electron's zip, and its node-gyp
      # build (native/window-style) runs on macOS only.
      - name: zsh for the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  check:
    # A skipped job passes: its part of the repository didn't change. A failed or cancelled one
    # fails the run, and so does anything short of success in `changes`, which holds the secret scan.
    name: Check
    needs: [changes, rust, rust-test, electron]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success" and ([.[].result] | all(. == "success" or . == "skipped"))' <<< "$NEEDS" > /dev/null
