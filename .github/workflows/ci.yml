# CI: what GitHub runs on GitHub's standard Ubuntu runners, with one job, Check, that says whether
# the run passed (docs/ci.md, "What GitHub runs"; the design is docs/ci-architecture.md).
#
#   plan            which lanes the change reaches, from the paths it changed, and gitleaks (with
#                   .gitleaks.toml) over the commits it brings
#   lint            in core/: cargo fmt --check, clippy -D warnings on every target
#   rust-build      in core/: one cargo nextest archive of the workspace, kept 1 day
#   rust-test       the archive's tests in 4 nextest shards (core/.config/nextest.toml's ci
#                   profile: one retry), each keeping its JUnit report 14 days
#   e2e             make e2e: headless, stub agents, no credentials, against oby-sphere's commit
#   control-plane   cloud/control-plane: pnpm test (vitest inside Miniflare) and pnpm check
#   electron        apps/electron: npm ci, typecheck, test and build
#   tools           tools/oby-check-blok (its own Cargo workspace): cargo test
#   Check           needs every job: fails when plan didn't pass or any job failed or was
#                   cancelled (a skipped job passes), and writes the lanes, each job's result, a
#                   failed shard's tests and every flaky test to its summary
#
# The Apple apps (xcodebuild) and swift test are the Mac check's (AGENTS.md, "Build and run").
#
# Modes. A job is skipped with `if:`, never with a workflow-level `paths:` (a workflow skipped by a
# path filter leaves its check Pending, which blocks merging; a skipped job reports success):
#   - A draft pull request without the `full-ci` label skips every job, Check included. The label
#     takes effect on the next push after labelling.
#   - A ready pull request into dev runs plan, lint when the rust lane is reached, and Check: no
#     test job. The Mac check (scripts/oby-check.sh) runs the tests each change reaches.
#   - A pull request labelled `full-ci` or into main, the merge queue (merge_group), the nightly
#     run on dev and a run on demand (workflow_dispatch) run every job their lanes reach. The
#     nightly and on-demand runs reach every lane.
#   - Only the nightly and on-demand runs save caches: a pull request's caches can't be read by
#     any other pull request (they're scoped to refs/pull/<n>/merge), so they only churned the
#     repository's 10 GB.
name: CI

on:
  pull_request:
    # Listing types replaces the default (opened, synchronize, reopened), so those stay explicit;
    # ready_for_review runs a draft that turned ready on the same head. No `labeled`: a run started
    # by another label would skip and post a success over a failed check on that head.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels the run it supersedes; merge queue, nightly and
# on-demand runs each run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust's 1.97 channel (its latest patch release), so a new stable's lints don't fail a change
  # that didn't touch them. Bump it on purpose. core/Cargo.toml's rust-version is the floor.
  RUSTUP_TOOLCHAIN: "1.97"
  WRANGLER_SEND_METRICS: "false"

jobs:
  plan:
    name: plan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.lanes.outputs.mode }}
      tests: ${{ steps.lanes.outputs.tests }}
      rust: ${{ steps.lanes.outputs.rust }}
      e2e: ${{ steps.lanes.outputs.e2e }}
      electron: ${{ steps.lanes.outputs.electron }}
      control-plane: ${{ steps.lanes.outputs.control-plane }}
      tools: ${{ steps.lanes.outputs.tools }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The mode: test jobs run in the merge queue, nightly, on demand, and on a pull request
      # labelled full-ci or into main. The lanes: a pull request's diff from its merge base, the
      # merge queue's from the group's base, every lane nightly and on demand. A path no row names,
      # or a diff that can't be read, reaches every lane.
      - name: What the change reaches
        id: lanes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          tests=true
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$FULL_CI" = true ]; then mode="pull request, labelled full-ci"
              elif [ "$BASE_REF" = main ]; then mode="pull request into main"
              else mode="pull request into $BASE_REF: plan and lint only"; tests=false
              fi
              range="$BASE...$HEAD" ;;
            merge_group) mode="merge queue"; range="$BASE..$HEAD" ;;
            schedule) mode="nightly"; range="" ;;
            *) mode="$GITHUB_EVENT_NAME"; range="" ;;
          esac

          rust=false e2e=false electron=false control_plane=false tools=false
          every_lane() { rust=true e2e=true electron=true control_plane=true tools=true; }
          if [ -z "$range" ]; then
            every_lane
          elif ! files=$(git diff --name-only "$range"); then
            echo "The diff $range can't be read: every lane."
            every_lane
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                .github/*|scripts/oby-check*|core/Cargo.lock|core/Cargo.toml|rust-toolchain*) every_lane ;;
                docs/api/*) rust=true ;;
                core/*|e2e/*|Makefile) rust=true e2e=true ;;
                apps/electron/*) electron=true ;;
                cloud/control-plane/*) control_plane=true ;;
                tools/oby-check-blok/*) tools=true ;;
                docs/*|factory/*|.claude/*|design/*|character/*|apps/ios/*|apps/watch/*|apps/shared/*|apps/Oby.xcodeproj/*|mcp/*) ;;
                *.md) ;;
                *) every_lane ;;
              esac
            done <<< "$files"
          fi
          echo "mode=$mode tests=$tests"
          echo "rust=$rust e2e=$e2e electron=$electron control-plane=$control_plane tools=$tools"
          {
            echo "mode=$mode"
            echo "tests=$tests"
            echo "rust=$rust"
            echo "e2e=$e2e"
            echo "electron=$electron"
            echo "control-plane=$control_plane"
            echo "tools=$tools"
          } >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The commits this run brings, as scripts/oby-check.sh scans a change's (with .gitleaks.toml
      # and .gitleaksignore): a pull request's from its merge base with the base branch, the merge
      # queue's from the group's base (base_sha..head_sha). Older history isn't rescanned here.
      # A run with no earlier commit (nightly and on demand have none) starts from where it leaves
      # the default branch instead; on dev itself that is its head, so a nightly or on-demand run on
      # dev scans the head commit alone: the commits before it were scanned on their pull requests
      # and in the queue.
      - name: gitleaks over the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=""
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            base=$(git merge-base "$BASE" "$HEAD")
          elif [ -n "$DEFAULT_BRANCH" ] && fork=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD" 2>/dev/null) \
              && [ "$fork" != "$(git rev-parse "$HEAD")" ]; then
            echo "No earlier commit to start from (${BASE:-none}): scanning from origin/$DEFAULT_BRANCH."
            base=$fork
          fi
          if [ -n "$base" ]; then
            range="$base..$HEAD"
          else
            echo "No earlier commit to start from (${BASE:-none}): scanning $HEAD alone."
            range="-1 $HEAD"
          fi
          echo "Scanning $range"
          gitleaks git . "--log-opts=$range" --config .gitleaks.toml --no-banner --redact

  lint:
    name: lint
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          shared-key: lint
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets --locked -- -D warnings

  rust-build:
    # The suite compiled once: rust-test's 4 shards run it from this archive and compile nothing.
    name: rust-build
    needs: plan
    if: needs.plan.outputs.rust == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          shared-key: test-build
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150

      - name: cargo nextest archive
        run: cargo nextest archive --manifest-path core/Cargo.toml --workspace --locked --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error

  rust-test:
    name: rust-test (${{ matrix.shard }}/4)
    needs: [plan, rust-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150

      # obid's job sandbox on Linux is bubblewrap (with slirp4netns for an agent's network), and
      # tests/sandbox.rs, the plug-in tests and the job tests make one. Ubuntu 24.04's AppArmor
      # refuses unprivileged user namespaces by default, which bubblewrap needs: this throwaway
      # runner allows them. The last line proves bubblewrap works here, so a sandbox test that
      # fails is the sandbox's failure, not the runner's.
      - name: bubblewrap for obid's job sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap slirp4netns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all --die-with-parent true

      # obid's own secret scan runs gitleaks (on PATH); its tests and make e2e need it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      # The archive extracts into core/, so its binaries sit at the core/target paths rust-build
      # compiled them for (env!("CARGO_BIN_EXE_obid") is fixed at compile time), and the
      # workspace's files (tests' fixtures, routes_guard's docs/api) are this checkout's. Retries
      # come from the ci profile, never from the command line.
      - name: cargo nextest run (${{ matrix.shard }}/4)
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/core" --extract-to "$GITHUB_WORKSPACE/core" \
            --partition "slice:${{ matrix.shard }}/4" --profile ci --no-fail-fast

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: core/target/nextest/ci/junit.xml
          retention-days: 14

  control-plane:
    name: control-plane
    needs: plan
    if: needs.plan.outputs.control-plane == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cloud/control-plane/package.json names no packageManager: the same pnpm as oby-sphere's.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/control-plane/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

      - name: pnpm check
        run: pnpm check

  e2e:
    name: e2e
    needs: plan
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OBI_SPHERE_DIR: ${{ github.workspace }}/oby-sphere
    defaults:
      run:
        working-directory: oby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oby
          persist-credentials: false

      # The Sphere side of the scenario: oby-sphere (public, no token) at the commit oby records in
      # e2e/oby-sphere.ref, never its moving dev, so a push there can't turn oby's checks red.
      # Moving to a newer oby-sphere is a change here, with this run as its test.
      - name: The oby-sphere commit oby is tested with
        id: sphere
        run: |
          ref=$(tr -d '[:space:]' < e2e/oby-sphere.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::e2e/oby-sphere.ref isn't a commit id: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: obi-ai-bot/oby-sphere
          ref: ${{ steps.sphere.outputs.ref }}
          path: oby-sphere
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: oby/core
          shared-key: e2e
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      # obid runs each job's agent (here the stub) in its bubblewrap sandbox: see rust-test.
      - name: bubblewrap for obid's job sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap slirp4netns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all --die-with-parent true

      # pnpm's version comes from oby-sphere's server/package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: oby-sphere/server/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            oby-sphere/server/pnpm-lock.yaml
            oby-sphere/spec/pnpm-lock.yaml

      # obid's own secret scan runs gitleaks (on PATH); its tests and make e2e need it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: make e2e
        run: make e2e

  electron:
    name: electron
    needs: plan
    if: needs.plan.outputs.electron == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      # No Linux packages: postinstall's install-electron only downloads Electron's zip, and its
      # node-gyp build (native/window-style, Objective-C++) runs on macOS only, so nothing compiles.
      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build

  tools:
    name: tools
    needs: plan
    if: needs.plan.outputs.tools == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/oby-check-blok
          shared-key: tools
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: cargo test
        run: cargo test --manifest-path tools/oby-check-blok/Cargo.toml --locked

  check:
    # The run's one status: the merge queue requires it (R01-03).
    name: Check
    needs: [plan, lint, rust-build, rust-test, control-plane, e2e, electron, tools]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.rust-test.result == 'success' || needs.rust-test.result == 'failure'
        with:
          pattern: junit-*
          path: junit

      # A failed test has <failure> or <error> in its shard's JUnit (its retry failed too); one
      # that passed on its retry has <flakyFailure> only.
      - name: The run's result
        shell: python3 {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys
          import xml.etree.ElementTree as ET

          needs = json.loads(os.environ["NEEDS"])
          plan = needs["plan"]
          out = plan.get("outputs") or {}
          lanes = ["rust", "e2e", "electron", "control-plane", "tools"]
          reached = [lane for lane in lanes if out.get(lane) == "true"]
          lines = [
              "## Check",
              "",
              f"- Mode: {out.get('mode') or 'unknown: plan gave none'}",
              f"- Lanes: {', '.join(reached) or 'none'}",
              "",
              "| Job | Result |",
              "|---|---|",
          ]
          lines += [f"| {job} | {need['result']} |" for job, need in needs.items()]

          failed, flaky, unreported = {}, [], []
          if needs["rust-test"]["result"] in ("success", "failure"):
              for shard in range(1, 5):
                  path = f"junit/junit-{shard}/junit.xml"
                  if not os.path.exists(path):
                      unreported.append(f"{shard}/4")
                      continue
                  for suite in ET.parse(path).getroot().iter("testsuite"):
                      for case in suite.iter("testcase"):
                          name = f"{suite.get('name')} {case.get('name')}"
                          if case.find("failure") is not None or case.find("error") is not None:
                              failed.setdefault(shard, []).append(name)
                          elif case.find("flakyFailure") is not None:
                              flaky.append(f"{name} (shard {shard}/4)")
          for shard, tests in sorted(failed.items()):
              lines += ["", f"### Failed: rust-test {shard}/4", ""] + [f"- `{t}`" for t in tests]
          if unreported:
              lines += ["", f"No JUnit report from rust-test {', '.join(unreported)}: it stopped before its tests ended."]
          if flaky:
              lines += ["", "### Flaky", "", "Passed only on a retry:", ""] + [f"- `{t}`" for t in flaky]

          bad = [job for job, need in needs.items() if need["result"] in ("failure", "cancelled")]
          if plan["result"] != "success":
              verdict = f"Failed: plan {plan['result']}, so no lane can be trusted."
          elif bad:
              verdict = f"Failed: {', '.join(bad)}."
          else:
              verdict = "Passed."
          lines += ["", f"**{verdict}**"]

          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text)
          sys.exit(0 if verdict == "Passed." else 1)
