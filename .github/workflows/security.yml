# Security scans, report-only: SAST (Semgrep), dependencies + IaC misconfig (Trivy) and secrets
# (TruffleHog) on every pull request, every push to dev and main, and weekly on dev for newly
# disclosed CVEs. Findings never fail a check; a scanner that did not run does (the "did not run"
# steps), so a green check means the scan really happened.
#
# This repository is public, so everything a run writes is public: the job summaries and the
# artifacts. Semgrep and Trivy report code locations (Trivy masks any secret it prints), and
# TruffleHog's report keeps only where a finding is and whether it verified, never the secret.
#
# On dev (push, the weekly schedule, dispatch) a last job sends the three reports to the
# maintainers' scan-report register, where they are kept past the 90-day artifact expiry. It runs
# in the `scan-publish` environment, never on a pull request, and does nothing without its token
# and URL (the OPS_SCAN_INGEST_TOKEN secret and OPS_SCAN_INGEST_URL variable).
name: security

on:
  pull_request:
    # ready_for_review: drafts skip the scans (each job's if:), so marking the PR ready runs them
    # on the same head before it can merge. Listing types replaces the default, so
    # opened/synchronize/reopened stay explicit. Not `labeled`: a run started by any other label
    # would post skipped checks over real ones; `full-ci` takes effect on the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1" # weekly (Mon 06:00 UTC) on dev, the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST — Semgrep
    # Draft PRs skip unless labelled full-ci. A skipped job still reports this check (as passing),
    # so a required check never waits on "Expected"; ready_for_review runs it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Semgrep (report-only)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
          # An explicit ruleset: `--config auto` refuses to run with --metrics=off.
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config p/default --metrics=off \
            --exclude node_modules --exclude target --exclude .build --exclude dist \
            --sarif --output "$RUNNER_TEMP/semgrep.sarif" . \
            && touch "$RUNNER_TEMP/semgrep.ran"
          {
            echo "### SAST — Semgrep"
            echo "- findings: $(jq '[.runs[].results[]] | length' "$RUNNER_TEMP/semgrep.sarif" 2>/dev/null || echo '?') (see the semgrep-sarif artifact)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if Semgrep did not run
        run: |
          if [ ! -f "$RUNNER_TEMP/semgrep.ran" ] || ! jq -e '.runs | length > 0' "$RUNNER_TEMP/semgrep.sarif" >/dev/null 2>&1; then
            echo "::error::Semgrep did not complete a scan (install or config failure). This is not a finding: no code was scanned."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-sarif
          path: ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: ignore

  sca-iac:
    name: SCA + IaC — Trivy
    # Draft PRs skip unless labelled full-ci (see sast).
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy (deps + IaC misconfig + secrets, report-only)
        continue-on-error: true
        env:
          TRIVY_VERSION: v0.75.0
        run: |
          set -o pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; export PATH="$bin:$PATH"
          # The install script from the pinned tag, not from main.
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$bin" "$TRIVY_VERSION"
          trivy fs . --scanners vuln,misconfig,secret \
            --skip-dirs node_modules,target,.build,dist --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 --no-progress --format table --output "$RUNNER_TEMP/trivy.txt" \
            && touch "$RUNNER_TEMP/trivy.ran"
          { echo "### SCA + IaC — Trivy"; echo '```'; tail -n 60 "$RUNNER_TEMP/trivy.txt" 2>/dev/null || echo "(none)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if Trivy did not run
        run: |
          if [ ! -f "$RUNNER_TEMP/trivy.ran" ]; then
            echo "::error::Trivy did not complete a scan (install or runtime failure). This is not a finding: nothing was scanned."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-report
          path: ${{ runner.temp }}/trivy.txt
          if-no-files-found: ignore

  secrets:
    name: Secrets — TruffleHog
    # Draft PRs skip unless labelled full-ci (see sast).
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
      - name: TruffleHog (report-only)
        continue-on-error: true
        env:
          TRUFFLEHOG_VERSION: v3.97.3
        run: |
          set -o pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; export PATH="$bin:$PATH"
          curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
            | sh -s -- -b "$bin" "$TRUFFLEHOG_VERSION"
          trufflehog git "file://$GITHUB_WORKSPACE" --results=verified,unknown --json \
            > "$RUNNER_TEMP/raw.jsonl" 2>"$RUNNER_TEMP/th.err" \
            && touch "$RUNNER_TEMP/trufflehog.ran"
          # Public run: keep only which detector, whether it verified, and where (commit, file, line).
          # A list of fields to keep, not to drop: detectors put the secret in Raw, RawV2, Redacted,
          # SecretParts, ExtraData and more. The raw file stays in $RUNNER_TEMP, which the runner
          # deletes with the job.
          jq -c '{DetectorName, DetectorType, DecoderName, Verified, SourceName,
                  SourceMetadata: {Data: {Git: (.SourceMetadata.Data.Git // {} | {commit, file, line, timestamp})}}}' \
            "$RUNNER_TEMP/raw.jsonl" > "$RUNNER_TEMP/th.jsonl" \
            || { rm -f "$RUNNER_TEMP/trufflehog.ran" "$RUNNER_TEMP/th.jsonl"; echo "::error::could not redact the TruffleHog report"; }
          {
            echo "### Secrets — TruffleHog"
            echo "- potential findings: $(grep -c . "$RUNNER_TEMP/th.jsonl" 2>/dev/null || echo 0) (verified/unknown; locations only, in the trufflehog-findings artifact)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if TruffleHog did not run
        run: |
          if [ ! -f "$RUNNER_TEMP/trufflehog.ran" ]; then
            echo "::error::TruffleHog did not complete a scan (install, runtime or redaction failure). This is not a finding: nothing was scanned."
            tail -n 20 "$RUNNER_TEMP/th.err" 2>/dev/null || true
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trufflehog-findings
          path: ${{ runner.temp }}/th.jsonl
          if-no-files-found: ignore

  publish-reports:
    name: Publish reports
    needs: [sast, sca-iac, secrets]
    # Only dev, never a pull request: the token stays out of PR runs, and PR scans would flood the
    # register. The environment's branch rule (dev only) keeps the token from any other ref.
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    environment: scan-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/reports
      - name: Upload the reports
        env:
          OPS_SCAN_INGEST_URL: ${{ vars.OPS_SCAN_INGEST_URL }}
          OPS_SCAN_INGEST_TOKEN: ${{ secrets.OPS_SCAN_INGEST_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/reports"
          resp="$RUNNER_TEMP/resp.json"
          if [ -z "${OPS_SCAN_INGEST_TOKEN}" ] || [ -z "${OPS_SCAN_INGEST_URL}" ]; then
            echo "::notice::OPS_SCAN_INGEST_TOKEN or OPS_SCAN_INGEST_URL not set — reports stay as run artifacts only"; exit 0
          fi
          publish() { # tool kind file
            local tool="$1" kind="$2" file="$3"
            [ -s "$file" ] || { echo "no $tool report"; return 0; }
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$OPS_SCAN_INGEST_URL" \
              -H "Authorization: Bearer ${OPS_SCAN_INGEST_TOKEN}" \
              -F "file=@${file}" -F "repo=${REPO}" -F "tool=${tool}" -F "kind=${kind}" \
              -F "commit_sha=${SHA}" -F "ref=${REF}" -F "run_id=${RUN_ID}-${tool}" -F "run_url=${RUN_URL}" \
              -F "scanned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)") || { echo "::warning::$tool upload failed (curl)"; return 0; }
            # The response body stays out of the public log: only the status code.
            if [ "$code" = "201" ]; then echo "$tool → 201"; else echo "::warning::$tool upload answered $code"; fi
          }
          publish semgrep sast "$reports/semgrep-sarif/semgrep.sarif"
          publish trivy sca "$reports/trivy-report/trivy.txt"
          publish trufflehog secrets "$reports/trufflehog-findings/th.jsonl"
